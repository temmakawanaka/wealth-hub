name: Bootstrap toolchain lockfile
on:
  push:
    branches:
      - feat/react-typescript-toolchain
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/react-typescript-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Format tracked files
        run: npx prettier --write "src/**/*.{ts,tsx,css}" "vite.config.ts" "eslint.config.mjs" "index.html" "README.md" "docs/adr/0001-technology-stack.md" "package.json" "tsconfig.json" ".github/workflows/*.yml" ".github/dependabot.yml" ".prettierrc.json" "SECURITY.md" "scripts/verify-repo.mjs"
      - name: Commit new lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .
          if ! git diff --cached --quiet; then
            git commit -m "chore: upgrade Vitest and regenerate npm lockfile [lockfile-ready]"
            git push origin HEAD:feat/react-typescript-toolchain
          fi
